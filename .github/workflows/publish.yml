name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release commit must be merged into main."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const { version } = JSON.parse(
            readFileSync("packages/account-evaluations/package.json", "utf8"),
          );
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`The release tag must be v${version}.`);
          }
          if (version.split("+")[0].includes("-") && process.env.NPM_DIST_TAG !== "next") {
            throw new Error("Mark prerelease versions as prereleases on GitHub.");
          }
          NODE
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:package
      - run: npm test
      - run: npm run typecheck
      - name: Publish to npm
        run: npm publish ./packages/account-evaluations --access public --tag "$NPM_DIST_TAG"
